<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Score Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <h1>Student Score Manager</h1>
      <p>Add students, scores, and calculate average.</p>
    </header>

    <!-- Main Content -->
    <main class="main">
      <form id="student-form" class="student-form">
        <input
          type="text"
          id="name"
          placeholder="Full Name"
          class="input-field"
        />
        <input
          type="text"
          id="student-id"
          placeholder="Student ID"
          class="input-field"
        />
        <input
          type="text"
          id="subject"
          placeholder="Subject (New or just recently added. Otherwise, please make a default choice!)"
          class="input-field"
        />
        <select id="subject-choice" name="subject">
          <option value="default">Make a choice</option>
          <option value="mathematic">Mathematic</option>
          <option value="french">French</option>
          <option value="basic-biology">Basic-biology</option>
          <option value="chemistry">Chemistry</option>
          <option value="history">History</option>
        </select>
        <input
          type="number"
          id="score"
          placeholder="Score (0 - 10)"
          class="input-field"
        />
        <button type="submit" id="add-btn" class="add-btn">Add Student</button>
      </form>

      <p id="error-msg" class="error-msg"></p>

      <table class="student-table" id="student-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Subject</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows will be inserted here -->
        </tbody>
      </table>

      <div class="summary">
        <p>Total students: <span id="student-count">0</span></p>
        <p>Average score: <span id="average-score">0</span></p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Created by Khoa Vo</p>
    </footer>

    <script src="script.js"></script>

    <!-- Error panel -->
    <div id="form-error-overlay" class="form-error-overlay">
      <div class="form-error-content">
        <p><!-- Missing input will dynamically goes here --></p>
        <button id="close-error-btn">Close</button>
      </div>
    </div>
  </body>
</html>
